# Render Deployment Blueprint
# This file defines your deployment configuration for Render

services:
  # Backend API Service
  - type: web
    name: rag-chatbot-backend
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: USE_GROQ
        value: True
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: VOYAGE_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: APP_NAME
        value: RAG Support Chatbot
      - key: DEBUG
        value: False
      - key: API_PREFIX
        value: /api/v1
      - key: CHROMA_PERSIST_DIRECTORY
        value: /opt/render/project/src/data/chroma_db
      - key: CHROMA_COLLECTION_NAME
        value: support_docs

  # Frontend Static Site
  - type: web
    name: rag-chatbot-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: rag-chatbot-backend
          property: url
